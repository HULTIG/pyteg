# Runs the full reproduction pipeline and checks that the tables match the
# ones committed in results/. Started by hand, and once a month.
name: reproduce

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python pipeline/run_all.py
      - name: Compare with the committed reference results
        run: git diff --exit-code -- results/*.csv
