[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyteg"
version = "0.1.0"
description = "Textual entailment by generality with asymmetric InfoSimba (a reproducible implementation of Pais, 2013)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "src/pyteg/resources/STOPWORDS_LICENSE"]
authors = [{ name = "Sebastião Pais", email = "sebastiaopais@gmail.com" }]
keywords = [
    "textual entailment",
    "generality",
    "asymmetric similarity",
    "InfoSimba",
    "association measures",
    "hypernymy",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "build"]

[project.scripts]
pyteg = "pyteg.cli:main"

[project.urls]
Homepage = "https://github.com/HULTIG/pyteg"
Thesis = "https://pastel.hal.science/pastel-00962176"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyteg = ["resources/*.txt", "resources/STOPWORDS_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/pyteg"]
addopts = "-q --doctest-modules"
